plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'app.projectunity'
    compileSdk 34

    defaultConfig {
        applicationId 'app.projectunity'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
